name: Windows Envoy Build (GitHub-Hosted Optimization)

on: [push]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Configure Git for Long Paths
        run: |
          git config --global core.longpaths true

      # FIX 1: Maximize runner disk space by purging massive pre-installed packages
      - name: Free Disk Space
        shell: powershell
        run: |
          Write-Host "Initial disk space:"
          Get-PSDrive C
          # Remove heavy standard image components not needed for Envoy C++ compilation
          Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Microsoft" -ErrorAction SilentlyContinue
          Write-Host "Post-cleanup disk space:"
          Get-PSDrive C

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bazelisk
        run: |
          choco install bazelisk

      # FIX 3: Cache Bazel builds to prevent 6-hour job timeouts on weak hardware
      - name: Bazel Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            C:/_bazel_runner
          key: ${{ runner.os }}-bazel-${{ hashFiles('**/REPOSITORY.bzl', '**/*.bazelrc') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Build Envoy Binary
        shell: bash
        env:
          BAZEL_VC: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC"
          BAZEL_OUTPUT_BASE: "C:/_b"
        run: |
          export BAZEL_SH="C:/msys64/usr/bin/bash.exe"
          
          # 1. Create a clean patch directory structure inside the runner
          mkdir -p C:/patches
          
          # 2. Write a Git diff patch file that replaces the invalid wildcard characters with a valid path structure
          cat << 'EOF' > C:/patches/fix_windows_glob.patch
diff --git a/compile/BUILD b/compile/BUILD
index 1234567..89abcdef 100644
--- a/compile/BUILD
+++ b/compile/BUILD
@@ -1,5 +1,5 @@
 filegroup(
     name = "compile_files",
-    srcs = glob(["**"]),
+    srcs = glob(["*"]),
     visibility = ["//visibility:public"],
 )
EOF

          # 3. Compile Envoy, using --patch_module to fix envoy_toolshed cleanly in transit
          bazel --output_base="$BAZEL_OUTPUT_BASE" build \
            -c opt \
            --enable_platform_specific_config \
            --patch_module=envoy_toolshed=C:/patches/fix_windows_glob.patch \
            --local_resources=memory=5120 \
            --local_resources=cpu=2 \
            --jobs=2 \
            //source/exe:envoy-static
