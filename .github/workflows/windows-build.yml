name: Windows Envoy Build (GitHub-Hosted Optimization)

on: [push]

jobs:
  build-windows-docker:
    # Crucial: Must run on Ubuntu because run_envoy_docker.sh expects a Linux Docker host
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      # Optimization: Cache the internal Bazel cache generated inside the Linux Docker container
      - name: Bazel Docker Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
          key: ${{ runner.os }}-envoy-docker-bazel-${{ hashFiles('**/REPOSITORY.bzl', '**/*.bazelrc') }}
          restore-keys: |
            ${{ runner.os }}-envoy-docker-bazel-

      - name: Build Envoy for Windows via CI Docker Script
        shell: bash
        env:
          # Fix for standard GitHub runner resources to fit within 7GB RAM
          BAZEL_BUILD_EXTRA_OPTIONS: "--local_resources=memory=5120 --local_resources=cpu=2 --jobs=2"
        run: |
          # 1. Ensure the script is executable in the runner context
          chmod +x ./ci/run_envoy_docker.sh
          chmod +x ./ci/windows_ci_steps.sh

          # 2. Execute the official Dockerized wrapper command
          ./ci/run_envoy_docker.sh './ci/windows_ci_steps.sh'

      - name: Upload Windows Envoy Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: envoy-windows-binary
          # Look inside the newly generated build output directory for the compiled .exe file
          path: |
            **/envoy.exe
            **/envoy-static.exe
          if-no-files-found: warn
