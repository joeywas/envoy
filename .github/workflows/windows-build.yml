name: Windows Envoy Build via Container

on: [push]

jobs:
  build-windows-docker:
    runs-on: windows-2022
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main
         
      - name: Build Envoy for Windows via CI Docker Script
        shell: bash
        env:
          # Fix for standard GitHub runner resources to fit within 7GB RAM
          BAZEL_BUILD_EXTRA_OPTIONS: "--local_resources=memory=5120 --local_resources=cpu=2 --jobs=2"
          # CRITICAL: Forces MSYS2 to pass raw Windows drive paths straight to the docker CLI
          # without breaking them down into Unix path definitions
          # MSYS_NO_PATHCONV: "1"
          COMPOSE_CONVERT_WINDOWS_PATHS: "1"
          # CRITICAL FIX: Forces docker-compose (invoked by Envoy's script) to 
          # use Hyper-V isolation mode and override strict kernel checking constraints.
          COMPOSE_OPTIONS: "--isolation=hyperv"
          DOCKER_DEFAULT_PLATFORM: "windows/amd64"
        run: |
          # 1. Translate the current drive path explicitly into a clean Unix mount layout
          # This strips out the extra 'd' directory injection fault
          export PWD=$(pwd | sed 's/^\/\([a-z]\)\//\1:\//g')
          
          # 1. Execute the official Dockerized wrapper command
          ./ci/run_envoy_docker.sh './ci/windows_ci_steps.sh'

      - name: Upload Windows Envoy Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: envoy-windows-binary
          # Look inside the newly generated build output directory for the compiled .exe file
          path: |
            **/envoy.exe
            **/envoy-static.exe
          if-no-files-found: warn
