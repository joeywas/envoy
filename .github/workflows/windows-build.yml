name: Windows Envoy Build (GitHub-Hosted Optimization)

on: [push]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Configure Git for Long Paths
        run: |
          git config --global core.longpaths true

      # FIX 1: Maximize runner disk space by purging massive pre-installed packages
      - name: Free Disk Space
        shell: powershell
        run: |
          Write-Host "Initial disk space:"
          Get-PSDrive C
          # Remove heavy standard image components not needed for Envoy C++ compilation
          Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Microsoft" -ErrorAction SilentlyContinue
          Write-Host "Post-cleanup disk space:"
          Get-PSDrive C

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bazelisk
        run: |
          choco install bazelisk

      # FIX 3: Cache Bazel builds to prevent 6-hour job timeouts on weak hardware
      - name: Bazel Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            C:/_bazel_runner
          key: ${{ runner.os }}-bazel-${{ hashFiles('**/REPOSITORY.bzl', '**/*.bazelrc') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Build Envoy Binary
        shell: bash
        env:
          BAZEL_VC: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC"
          BAZEL_OUTPUT_BASE: "C:/_b"
        run: |
          export BAZEL_SH="C:/msys64/usr/bin/bash.exe"

          # 1. Manually initialize the external module cache folders so the patch path exists
          echo "Initializing target module layout directory paths..."
          mkdir -p "C:/_b/external/envoy_toolshed+"
          mkdir -p "C:/_b/external/envoy_toolshed+/compile"

          # 2. Write a clean dummy file into the folder using a single echo string to satisfy YAML
          echo 'filegroup(name = "compile_files", srcs = glob(["*"]), visibility = ["//visibility:public"])' > "C:/_b/external/envoy_toolshed+/compile/BUILD"
          echo 'filegroup(name = "compile_files", srcs = glob(["*"]), visibility = ["//visibility:public"])' > "C:/_b/external/envoy_toolshed+/compile/BUILD.bazel"

          # 3. Force Bazel to download all external dependency repositories into the local cache
          echo "Fetching Envoy dependencies..."
          bazel --output_base="$BAZEL_OUTPUT_BASE" fetch //source/exe:envoy-static || true

          # 4. Use native POSIX paths (/c/_b/) to find and strip out any unsafe Java glob sequences
          echo "Sweeping external cache to replace problematic Windows glob patterns..."
          find /c/_b/external/ -type f \( -name "BUILD" -o -name "BUILD.bazel" \) -exec sed -i 's/glob(\["\*\*"\])/glob(\["\*","\*\/\*","\*\/\*\/\*"\])/g' {} + 2>/dev/null || true

          # 5. Kick off the clean compilation step
          echo "Starting the build..."
          bazel --output_base="$BAZEL_OUTPUT_BASE" build \
            -c opt \
            --enable_platform_specific_config \
            --local_resources=memory=5120 \
            --local_resources=cpu=2 \
            --jobs=2 \
            //source/exe:envoy-static
