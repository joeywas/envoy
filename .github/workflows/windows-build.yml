name: Windows Envoy Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Configure Git for Long Paths
        run: |
          git config --global core.longpaths true

      - name: Run Envoy Windows CI Build Container
        shell: bash
        env:
          # This overrides the script's internal default fallback (--config=msvc-cl)
          BAZEL_BUILD_EXTRA_OPTIONS: "--config=windows"
        run: |
          # Executes Envoy's native Windows building script via Docker
          ./ci/windows_ci_steps.sh
