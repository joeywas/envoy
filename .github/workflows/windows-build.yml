name: Windows Envoy Build (GitHub-Hosted Optimization)

on: [push]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Configure Git for Long Paths
        run: |
          git config --global core.longpaths true

      # FIX 1: Maximize runner disk space by purging massive pre-installed packages
      - name: Free Disk Space
        shell: powershell
        run: |
          Write-Host "Initial disk space:"
          Get-PSDrive C
          # Remove heavy standard image components not needed for Envoy C++ compilation
          Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Microsoft" -ErrorAction SilentlyContinue
          Write-Host "Post-cleanup disk space:"
          Get-PSDrive C

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bazelisk
        run: |
          choco install bazelisk

      # FIX 3: Cache Bazel builds to prevent 6-hour job timeouts on weak hardware
      - name: Bazel Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            C:/_bazel_runner
          key: ${{ runner.os }}-bazel-${{ hashFiles('**/REPOSITORY.bzl', '**/*.bazelrc') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Build Envoy Binary
        shell: bash
        env:
          BAZEL_VC: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC"
          BAZEL_OUTPUT_BASE: "C:/_b"
        run: |
          export BAZEL_SH="C:/msys64/usr/bin/bash.exe"
          
          # 1. Create a local stub directory structure for the broken repo
          mkdir -p C:/stub_toolshed/dependency
          mkdir -p C:/stub_toolshed/compile
          mkdir -p C:/stub_toolshed/repository
          
          # 2. Write required build metadata and macro definitions
          touch C:/stub_toolshed/BUILD
          touch C:/stub_toolshed/dependency/BUILD
          touch C:/stub_toolshed/compile/BUILD
          touch C:/stub_toolshed/repository/BUILD
          
          # FIX: Explicitly register the module name inside the stub
          echo 'module(name = "envoy_toolshed")' > C:/stub_toolshed/MODULE.bazel
          
          echo "def json_data(**kwargs): pass" > C:/stub_toolshed/macros.bzl
          echo "def json_merge(**kwargs): pass" > C:/stub_toolshed/repository/utils.bzl
          echo "def updater(**kwargs): pass" > C:/stub_toolshed/dependency/macros.bzl
          echo "def setup_sanitizer_libs(**kwargs): pass" > C:/stub_toolshed/compile/sanitizer_libs.bzl
          
          # 3. Re-run your explicit module override build step
          bazel --output_base="$BAZEL_OUTPUT_BASE" build \
            -c opt \
            --enable_platform_specific_config \
            --override_module=envoy_toolshed=C:/stub_toolshed \
            --local_resources=memory=5120 \
            --local_resources=cpu=2 \
            --jobs=2 \
            //source/exe:envoy-static
